<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa da Equipe · Audiovisual Pecege</title>
  <meta name="description" content="Estrutura da equipe Audiovisual Pecege por área, time e gestão.">
  <meta name="theme-color" content="#18181B">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icone-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icone-192.png">
  <link rel="apple-touch-icon" href="assets/icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="equipe.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 7h10v10M7 17 17 7"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    </defs>
  </svg>

  <div class="wrap">
    <header class="topbar">
      <a href="index.html" class="back"><svg><use href="#i-back"/></svg>Atalhos</a>
      <a class="miro" id="miro" href="#" target="_blank" rel="noopener">Abrir no Miro<svg><use href="#i-arrow"/></svg></a>
    </header>

    <section class="intro">
      <h1>Mapa da <span>Equipe</span></h1>
      <p class="meta"><b id="total"></b> pessoas no Audiovisual · atualizado em <span id="atualizacao"></span></p>
    </section>

    <section class="gestao" aria-label="Gestão">
      <div class="gestao-cards" id="gestao"></div>
      <p class="relacionados" id="relacionados"></p>
    </section>

    <div class="toolbar">
      <label class="busca">
        <svg><use href="#i-search"/></svg>
        <input type="search" id="busca" placeholder="Buscar pessoa…" autocomplete="off" aria-label="Buscar pessoa">
        <kbd>/</kbd>
      </label>
      <div class="filtros" role="group" aria-label="Filtrar">
        <button type="button" class="filtro" data-filtro="raoni" aria-pressed="false"><i class="dot g-raoni"></i>Gestão Raoni</button>
        <button type="button" class="filtro" data-filtro="paulo" aria-pressed="false"><i class="dot g-paulo"></i>Gestão Paulo</button>
        <button type="button" class="filtro" data-filtro="coord" aria-pressed="false"><i class="dot g-coord"></i>Coordenação</button>
        <button type="button" class="filtro" data-filtro="freela" aria-pressed="false"><i class="dot g-freela"></i>Freela</button>
        <button type="button" class="filtro" data-filtro="novo" aria-pressed="false"><i class="dot g-novo"></i>Novo</button>
      </div>
    </div>

    <main id="areas"></main>

    <p class="vazio" id="vazio" hidden>Ninguém encontrado para essa busca.</p>

    <noscript><p class="vazio">Ative o JavaScript para ver o mapa, ou <a href="https://miro.com/app/board/uXjVORwJtBg=/?share_link_id=547994466562">abra no Miro</a>.</p></noscript>

    <footer class="rodape">
      <a href="index.html">← Voltar aos atalhos</a>
    </footer>
  </div>

  <script src="equipe-dados.js"></script>
  <script src="equipe.js"></script>
</body>
</html>
